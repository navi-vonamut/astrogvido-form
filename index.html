<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro Gvido — Профиль рождения</title>

  <!-- Bootstrap + gijgo (как у вас) -->
  <link rel="stylesheet" href="stylesheet/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="javascript/bootstrap.bundle.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>



  <style>
    .city-wrap {
      position: relative;
    }

    #city-suggest.dropdown-menu {
      max-height: 280px;
      overflow-y: auto;
      font-size: 0.95rem;
    }

    .hint {
      color: #9aa0a6;
      font-size: 0.875rem;
    }

    /* Общий фон */
body {
  background: radial-gradient(
    circle at top,
    #1b1f2a 0%,
    #0f1117 60%,
    #0b0d12 100%
  );
}

/* Карточка формы */
.card {
  background-color: #141824;
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

/* Заголовки */
h1, h4 {
  color: #e9ecf1;
}

/* Вторичный текст */
.lead,
.hint,
.form-text {
  color: #b6bccd;
}

/* Инпуты */
.form-control {
  background-color: #0f1320;
  border-color: #2a2f45;
  color: #e9ecf1;
}

.form-control::placeholder {
  color: #7f86a3;
}

/* Фокус */
.form-control:focus {
  background-color: #0f1320;
  border-color: #6ea8fe;
  box-shadow: 0 0 0 0.25rem rgba(110, 168, 254, 0.25);
}

/* Primary-кнопка */
.btn-primary {
  background: linear-gradient(135deg, #5c7cfa, #4dabf7);
  border: none;
}

.btn-primary:hover {
  filter: brightness(1.1);
}

/* Dropdown (подсказки города) */
.dropdown-menu {
  background-color: #141824;
  border-color: #2a2f45;
}

.dropdown-item {
  color: #e9ecf1;
}

.dropdown-item:hover {
  background-color: #1f2440;
}

  </style>
</head>

<body class="bg-body-tertiary">
  <div class="container">
    <main>
      <div class="p-3 text-center">
        <img class="d-block mx-auto mb-4" src="image/logo.png" alt="logo"
          width="72" height="72">
        <h1 class="h2" id="pageTitle" data-i18n="title">Данные о дне рождения</h1>
        <p class="lead" id="pageLead" data-i18n="lead">
          Укажите имя, город рождения, дату и время. Если время неизвестно — поставим «солнечную» карту (12:00).
        </p>
      </div>

      <div class="row justify-content-center g-4">
        <div class="col-12 col-lg-6">
          <div class="card">
            <div class="card-body">
              <div class="row g-5">
                <div class="col-md-12">
                  <h4 class="mb-3 card-title" data-i18n="natalTitle">Натальная карта</h4>

                  <form class="needs-validation" novalidate>
                    <div class="row g-3">
                      <div class="col-12">
                        <label for="firstName" class="form-label" data-i18n="nameLabel">Имя (необязательно)</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Например: Анна"
                          data-i18n-placeholder="namePh">
                      </div>

                      <div class="col-12 city-wrap">
                        <label for="city" class="form-label" data-i18n="cityLabel">Город / населённый пункт</label>
                        <input type="text" class="form-control" id="city" placeholder="Начните вводить…"
                          data-i18n-placeholder="cityPh" autocomplete="off" required>
                        <!-- выпадающее меню подсказок -->
                        <div id="city-suggest" class="dropdown-menu w-100"></div>
                        <div class="invalid-feedback" data-i18n="cityInvalid">Укажите город из списка.</div>
                      </div>

                      <div class="col-6">
                        <label class="form-label" for="datepicker" data-i18n="dateLabel">Дата рождения</label>
                        <input type="date" class="form-control" id="datepicker" required />
                      </div>

                      <div class="col-6">
                        <label class="form-label" for="timepicker" data-i18n="timeLabel">Время рождения</label>
                        <input type="time" class="form-control" id="timepicker" required />
                        <div class="form-check mt-2">
                          <input class="form-check-input" type="checkbox" id="unknownTime">
                          <label class="form-check-label" for="unknownTime" data-i18n="unknownTime">
                            Не знаю время (поставим 12:00)
                          </label>
                        </div>
                      </div>
                    </div>

                    <div class="col-12">
                      <hr class="my-4" />
                      <h4 class="mb-3" data-i18n="dailyTitle">Ежедневный гороскоп по транзитам</h4>
                      <div class="row g-3">
                        <div class="col-md-6">
                          <label class="form-label" for="transitTime" data-i18n="transitTimeLabel">Время
                            отправки</label>
                          <input type="time" class="form-control" id="transitTime" />
                          <div class="hint mt-1" data-i18n="transitHint">
                            В это время вы будете получать ежедневную интерпретацию транзитов.
                          </div>
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                          <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="subscribeDaily">
                            <label class="form-check-label" for="subscribeDaily" data-i18n="subscribeDaily">
                              Подписаться на ежедневный гороскоп
                            </label>
                          </div>
                        </div>
                      </div>
                    </div>

                    <hr class="my-4" />
                    <button class="w-100 btn btn-primary btn-lg" id="saveBtn" type="submit" data-i18n="save">
                      Сохранить
                    </button>
                  </form>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

<script>
  // ====== Telegram SDK ======
  const tg = window.Telegram?.WebApp;
  tg?.ready();

  
  if (tg?.colorScheme === 'dark') {
    document.documentElement.setAttribute('data-bs-theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-bs-theme', 'light');
  }

  const SUPPORTED_LANGS = new Set(['ru', 'en', 'es', 'pt']);

  function normalizeLang(code) {
    const c = String(code || '').toLowerCase().trim();
    const base = c.split('-')[0];
    return SUPPORTED_LANGS.has(base) ? base : 'ru';
  }

  function getTelegramLangFast() {
    const lc = tg?.initDataUnsafe?.user?.language_code;
    return lc ? normalizeLang(lc) : null;
  }

  function suggestLangForYa(lang) {
    if (lang === 'ru') return 'ru_RU';
    if (lang === 'es') return 'es_ES';
    if (lang === 'pt') return 'pt_BR';
    return 'en_US';
  }

  let UI_LANG = getTelegramLangFast() || 'ru';
  document.documentElement.lang = UI_LANG;

  const I18N = {

  title: "Данные о дне рождения",
  lead: "Укажите имя, город рождения, дату и время. Если время неизвестно — поставим «солнечную» карту (12:00).",

  dailyTitle: "Ежедневный гороскоп по транзитам",

  cityInvalid: "Укажите город из списка.",

  nameLabel: "Имя (необязательно)",
  namePh: "Например: Анна",

  cityLabel: "Город / населённый пункт",
  cityPh: "Начните вводить…",

  dateLabel: "Дата рождения",
  timeLabel: "Время рождения",
  unknownTime: "Не знаю время (поставим 12:00)",

  subscribeDaily: "Присылать ежедневные транзиты",
  transitTimeLabel: "Время рассылки",
  save: "Сохранить",

  errDate: "Укажите дату рождения.",
  errCity: "Укажите город.",
  errPickFromList: "Пожалуйста, выберите город из подсказок, а не просто введите текст.",
  savedOk: "Сохранено ✅",
  savedFail: "Не удалось сохранить 😔 Попробуйте позже.",

  loading: "Загрузка…",
  saving: "Сохраняю…",
  errNetwork: "Сеть шалит 😵‍💫 Проверьте интернет и попробуйте ещё раз.",
  errInitDataMissing: "Не удалось получить данные Telegram (init_data). Откройте форму из бота.",
  errServer: "Сервер вернул ошибку. Попробуйте позже."
},

en: {
  title: "Birth details",
  lead: "Enter your name, birthplace, date and time. If time is unknown, we’ll use 12:00.",

  natalTitle: "Natal chart",
  dailyTitle: "Daily transits horoscope",
  transitHint: "At this time you will receive a daily interpretation of transits.",
  cityInvalid: "Please choose a city from the list.",

  nameLabel: "Name (optional)",
  namePh: "For example: Anna",

  cityLabel: "City / locality",
  cityPh: "Start typing…",

  dateLabel: "Birth date",
  timeLabel: "Birth time",
  unknownTime: "I don't know the time (use 12:00)",

  subscribeDaily: "Send daily transits",
  transitTimeLabel: "Delivery time",
  save: "Save",

  errDate: "Please enter a birth date.",
  errCity: "Please enter a city.",
  errPickFromList: "Please pick a city from suggestions (don’t just type it).",
  savedOk: "Saved ✅",
  savedFail: "Failed to save 😔 Please try again.",

  loading: "Loading…",
  saving: "Saving…",
  errNetwork: "Network error 😵‍💫 Check your connection and try again.",
  errInitDataMissing: "Couldn’t get Telegram init_data. Please open this form from the bot.",
  errServer: "Server error. Please try again later."
},

es: {
  title: "Datos de nacimiento",
  lead: "Indica tu nombre, ciudad de nacimiento, fecha y hora. Si no sabes la hora, usaremos 12:00.",

  natalTitle: "Carta natal",
  dailyTitle: "Horóscopo diario por tránsitos",
  transitHint: "A esta hora recibirás una interpretación diaria de los tránsitos.",
  cityInvalid: "Elige una ciudad de la lista.",

  nameLabel: "Nombre (opcional)",
  namePh: "Por ejemplo: Ana",

  cityLabel: "Ciudad / localidad",
  cityPh: "Empieza a escribir…",

  dateLabel: "Fecha de nacimiento",
  timeLabel: "Hora de nacimiento",
  unknownTime: "No sé la hora (usar 12:00)",

  subscribeDaily: "Enviar tránsitos diarios",
  transitTimeLabel: "Hora de envío",
  save: "Guardar",

  errDate: "Indica la fecha de nacimiento.",
  errCity: "Indica la ciudad.",
  errPickFromList: "Elige una ciudad de las sugerencias (no la escribas solo).",
  savedOk: "Guardado ✅",
  savedFail: "No se pudo guardar 😔 Inténtalo de nuevo.",

  loading: "Cargando…",
  saving: "Guardando…",
  errNetwork: "Error de red 😵‍💫 Revisa tu conexión e inténtalo de nuevo.",
  errInitDataMissing: "No se pudo obtener init_data de Telegram. Abre el formulario desde el bot.",
  errServer: "Error del servidor. Inténtalo más tarde."
},

pt: {
  title: "Dados de nascimento",
  lead: "Informe seu nome, cidade de nascimento, data e hora. Se não souber a hora, usaremos 12:00.",

  natalTitle: "Mapa natal",
  dailyTitle: "Horóscopo diário por trânsitos",
  transitHint: "Nesse horário você receberá uma interpretação diária dos trânsitos.",
  cityInvalid: "Escolha uma cidade da lista.",

  nameLabel: "Nome (opcional)",
  namePh: "Por exemplo: Ana",

  cityLabel: "Cidade / localidade",
  cityPh: "Comece a digitar…",

  dateLabel: "Data de nascimento",
  timeLabel: "Hora de nascimento",
  unknownTime: "Não sei a hora (usar 12:00)",

  subscribeDaily: "Enviar trânsitos diários",
  transitTimeLabel: "Horário de envio",
  save: "Salvar",

  errDate: "Informe a data de nascimento.",
  errCity: "Informe a cidade.",
  errPickFromList: "Escolha uma cidade nas sugestões (não apenas digite).",
  savedOk: "Salvo ✅",
  savedFail: "Não foi possível salvar 😔 Tente novamente.",

  loading: "Carregando…",
  saving: "Salvando…",
  errNetwork: "Erro de rede 😵‍💫 Verifique sua conexão e tente novamente.",
  errInitDataMissing: "Não foi possível obter o init_data do Telegram. Abra este formulário pelo bot.",
  errServer: "Erro no servidor. Tente novamente mais tarde."
}
};

function t(key) {
  return (I18N[UI_LANG] && I18N[UI_LANG][key]) || (I18N.ru && I18N.ru[key]) || key;
}

function applyI18n() {
  // текстовые узлы
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });

  // placeholder
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const key = el.getAttribute("data-i18n-placeholder");
    el.setAttribute("placeholder", t(key));
  });

  // можно расширить на title/aria-label при необходимости
}


  function pickInitData() {
    // 1) WebApp.initData (основной вариант)
    if (tg?.initData && tg.initData.length > 0) return tg.initData;
    // 2) query ?init_data=...
    const sp = new URLSearchParams(location.search);
    const q1 = sp.get('init_data') || sp.get('tgWebAppData');
    if (q1) return q1;
    // 3) hash #tgWebAppData=...
    const hp = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
    const q2 = hp.get('init_data') || hp.get('tgWebAppData');
    if (q2) return q2;
    return '';
  }

  const INIT_DATA = pickInitData();

  function parseTelegramUserFromInitData() {
    if (!INIT_DATA) return null;

    // INIT_DATA — это строка формата query: "query_id=...&user=%7B...%7D&auth_date=...&hash=..."
    const params = new URLSearchParams(INIT_DATA);
    const userJson = params.get('user');
    if (!userJson) return null;

    try {
      return JSON.parse(userJson);
    } catch (e) {
      console.warn('Не удалось распарсить user из init_data:', e);
      return null;
    }
  }


  // ====== API base ======
  function getApiBase() {
    const qs = new URLSearchParams(location.search);

    // 1. Если явно передали ?api=..., уважаем это (для ручных тестов)
    const explicitApi = qs.get('api');
    if (explicitApi) {
      const base = explicitApi.trim();
      return base.endsWith('/') ? base : base + '/';
    }

    // 2. env=dev / env=prod (или что-то похожее)
    const env = (qs.get('env') || 'prod').toLowerCase();

    if (env === 'dev') {
      // ТУТ подставь свой реальный dev-API
      return 'https://dev-api.astrogvido.ru/';
    }

    // По умолчанию — прод
    return 'https://api.astrogvido.ru/';
  }


  const API_BASE = getApiBase();

  function apiUrl(path, params) {
    const u = new URL(path, API_BASE);
    if (params) {
      for (const [k, v] of Object.entries(params)) {
        if (v !== undefined && v !== null) u.searchParams.set(k, String(v));
      }
    }
    return u.toString();
  }

  // ====== Suggest (как было) ======
  const DEBOUNCE_MS = 250;
  const MIN_QUERY = 2;
  const SESSIONTOKEN = (self.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));
  let SUGGEST_LL = null, SUGGEST_SPN = null;

  let selected = null;

  function debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  function renderSuggestions(items) {
    const $drop = $('#city-suggest');
    $drop.empty();
    if (!items || !items.length) {
      $drop.removeClass('show');
      return;
    }
    items.forEach(it => {
      const $a = $('<a class="dropdown-item" href="#"></a>').text(it.label);
      $a.on('click', (e) => {
        e.preventDefault();
        selected = it;
        $('#city').val(it.label);
        $drop.removeClass('show');
      });
      $drop.append($a);
    });
    $drop.addClass('show');
  }

  const suggest = debounce(async function () {
    selected = null;
    const text = $('#city').val().trim();
    if (text.length < MIN_QUERY) {
      $('#city-suggest').removeClass('show');
      return;
    }

    const params = {
      text,
      lang: suggestLangForYa(UI_LANG),
      results: 8,
      types: 'geo',
      print_address: 1,
      attrs: 'uri',
      sessiontoken: SESSIONTOKEN
    };
    if (SUGGEST_LL) params.ll = SUGGEST_LL;
    if (SUGGEST_SPN) params.spn = SUGGEST_SPN;

    try {
      const url = apiUrl('/places/suggest_ya', params);
      const r = await fetch(url, { cache: 'no-store' });
      const data = await r.json();

      renderSuggestions(data.items || []);
    } catch (e) {
      $('#city-suggest').removeClass('show');
    }
  }, DEBOUNCE_MS);

  $('#city').on('input focus', suggest);
  $(document).on('click', (e) => {
    if (!$(e.target).closest('#city').length && !$(e.target).closest('#city-suggest').length) {
      $('#city-suggest').removeClass('show');
    }
  });

  // ====== Загрузка профиля (GET /tg/profile) — по желанию ======
  async function loadProfileFromApi() {
    if (!INIT_DATA) {
      showAlert(t('errInitDataMissing'), 'danger');
      return;
    }

    try {
      const url = apiUrl('/tg/profile', { init_data: INIT_DATA });
      const r = await fetch(url, { cache: 'no-store' });
      const data = await r.json();

      const savedLang = data?.settings?.lang;
      if (savedLang) {
        UI_LANG = normalizeLang(savedLang);
        document.documentElement.lang = UI_LANG;
        applyI18n();
      }


      if (!data.profile) return;
      const p = data.profile;

      // ====== Daily transit subscription ======
      // Если send_time сохранён — значит подписка включена
      if (p.send_time) {
        $('#subscribeDaily').prop('checked', true);

        // Приводим "HH:MM:SS" -> "HH:MM"
        const st = String(p.send_time).slice(0, 5);
        $('#transitTime').val(st || '09:00');
      } else {
        $('#subscribeDaily').prop('checked', false);

        // Если подписки нет — пусть в поле всё равно будет дефолт 09:00
        if (!$('#transitTime').val()) {
          $('#transitTime').val('09:00');
        }
      }


      // Дата
      if (p.date) {
        let d = String(p.date).trim();
        d = d.replace(/[./]/g, '-');     // 1990/05/03 -> 1990-05-03
        $('#datepicker').val(d);
      }

      // Время
      if (p.time) {
        $('#timepicker').val(String(p.time).slice(0, 5)); // HH:MM:SS -> HH:MM
      }

      // Имя
      if (p.name) {
        $('#firstName').val(p.name);
      }

      // Город
      if (p.city || p.label) {
        const cityText = p.label || p.city;
        $('#city').val(cityText);

        // Можно попытаться частично восстановить selected,
        // чтобы не заставлять юзера кликать ещё раз
        selected = {
          label: cityText,
          uri: p.yandex_uri || null,
          // lat/lon/tz можем взять из p / place, если будешь их тоже возвращать
        };
      }

      // Время рассылки
      if (p.send_time) {
        $('#transitTime').val(p.send_time);
      }
    } catch (e) {
      console.warn('Не удалось загрузить профиль:', e);
    }
  }


  $(document).ready(() => {
    // Дефолт для рассылки транзитов
    if (!$('#transitTime').val()) {
      $('#transitTime').val('09:00');
    }
    $('#subscribeDaily').prop('checked', false);
    // 1) Сначала пробуем подгрузить профиль из API (если есть)
    loadProfileFromApi();
    applyI18n();

    // 2) Если имени в форме нет — попробуем достать его из Telegram
    const tgUser = parseTelegramUserFromInitData();
    if (tgUser) {
      const fullName = [
        tgUser.first_name || '',
        tgUser.last_name || '',
      ].join(' ').trim();

      const username = tgUser.username ? tgUser.username.trim() : '';

      // Приоритет: fullName -> username -> ничего
      const suggestedName = fullName || username || '';

      if (suggestedName && !$('#firstName').val().trim()) {
        $('#firstName').val(suggestedName);
      }
    }
  });


  // ====== Submit ======
  $('form.needs-validation').on('submit', async function (e) {
    e.preventDefault();

    const name = $('#firstName').val().trim(); // пока никуда не шлём, только в будущем
    const date_local = $('#datepicker').val(); // yyyy-mm-dd
    let time_local = $('#unknownTime').is(':checked')
      ? '12:00:00'
      : ($('#timepicker').val() || '');

    if (!date_local) {
      alert('Укажите дату рождения.');
      return;
    }

    if (!time_local) time_local = '12:00:00';
    else if (time_local.length === 5) time_local += ':00'; // HH:MM -> HH:MM:00

    const cityVal = $('#city').val().trim();
    if (!cityVal) {
      alert('Укажите город.');
      return;
    }

    if (!selected) {
      alert('Пожалуйста, выберите город из списка подсказок, а не просто вводите текст.');
      return;
    }

    // --- Ежедневные транзиты ---
    let sendTimeRaw = $('#transitTime').val().trim();
    const subscribeDaily = $('#subscribeDaily').is(':checked');

    // Если включили подписку, но время не указали — ставим дефолт 09:00
    if (subscribeDaily && !sendTimeRaw) {
      sendTimeRaw = '09:00';
    }

    // Нормализуем к формату HH:MM:SS (бэку так обычно спокойнее)
    if (sendTimeRaw && sendTimeRaw.length === 5) {
      sendTimeRaw += ':00';
    }


    // 1) Сначала ходим в /natal/by_city, чтобы backend сам:
    //    - геокодил город,
    //    - нашёл таймзону,
    //    - посчитал исторический UTC offset,
    //    - вернул lat/lon + utc_offset_str.
    const basePayload = {
      name,
      lang: UI_LANG,
      date_local,
      time_local,
      yandex_uri: selected.uri,
      label: selected.label,
      city: selected.label
    };

    let place;
    try {
      const rNatal = await fetch(apiUrl('/natal/by_city'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(basePayload)
      });
      const natalData = await rNatal.json();
      if (!rNatal.ok) {
        throw new Error(natalData.detail || natalData.error || 'Ошибка расчёта натальной карты');
      }
      place = natalData.place;
      if (!place || place.lat == null || place.lon == null || !place.utc_offset_str) {
        throw new Error('Сервис не вернул координаты и часовой пояс.');
      }
    } catch (err) {
      alert('Не удалось определить место и время рождения: ' + err.message);
      return;
    }

    // 2) Если форма открыта НЕ из Telegram — просто покажем, что всё ок,
    //    а профиль в боте сохранять некуда.
    if (!tg || !INIT_DATA) {
      alert('Профиль рассчитан: ' + (place.display_name || 'ok') + '\nОткройте эту форму из Telegram-бота, чтобы сохранить профиль.');
      return;
    }

    const profilePayload = {
      date: date_local,
      time: time_local,
      tz: place.utc_offset_str,
      lat: place.lat,
      lon: place.lon,
      name: name || null,
      city: cityVal || (place.display_name || null),
      yandex_uri: selected.uri || null,
      label: selected.label || cityVal || null,
    };

    if (subscribeDaily && sendTimeRaw) {
      profilePayload.send_time = sendTimeRaw;
    } else {
      profilePayload.send_time = null;
    }


    try {
      const url = apiUrl('/tg/profile', { init_data: INIT_DATA });
      const r = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(profilePayload)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        throw new Error(data.detail || data.error || 'Ошибка сохранения профиля');
      }

      // В Telegram: тихо закрываем форму, бот дальше уже работает с профилем из Sub.
      if (tg) {
        tg.close();
      } else {
        alert('Профиль сохранён ✅');
      }
    } catch (err) {
      alert('Не удалось сохранить профиль: ' + err.message);
    }
  });
</script>

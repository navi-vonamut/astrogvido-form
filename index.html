<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro Gvido — Профиль рождения</title>

  <!-- Bootstrap + gijgo (как у вас) -->
  <link rel="stylesheet" href="stylesheet/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="javascript/bootstrap.bundle.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta name="api-base" content="https://api.astrogvido.ru">


  <style>
    .city-wrap {
      position: relative;
    }

    #city-suggest.dropdown-menu {
      max-height: 280px;
      overflow-y: auto;
      font-size: 0.95rem;
    }

    .hint {
      color: #9aa0a6;
      font-size: 0.875rem;
    }
  </style>
</head>

<body class="bg-body-tertiary">
  <div class="container">
    <main>
      <div class="p-3 text-center">
        <img class="d-block mx-auto mb-4" src="image/cute-chibi-style-fantasy-creature-inspired-by-taur (1).png" alt=""
          width="72" height="72">
        <h1 class="h2">Данные о дне рождения</h1>
        <p class="lead">Укажите имя, город рождения, дату и время. Если время неизвестно — поставим «солнечную» карту
          (12:00).</p>
      </div>
      <div class="row justify-content-center g-4">
        <div class="col-12 col-lg-6">
          <div class="card">
            <div class="card-body">
              <div class="row g-5">
                <div class="col-md-12">
                  <h4 class="mb-3 card-title">Натальная карта</h4>
                  <form class="needs-validation" novalidate>
                    <div class="row g-3">
                      <div class="col-12">
                        <label for="firstName" class="form-label">Имя (необязательно)</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Например: Анна">
                      </div>

                      <div class="col-12 city-wrap">
                        <label for="city" class="form-label">Город / населённый пункт</label>
                        <input type="text" class="form-control" id="city" placeholder="Начните вводить…"
                          autocomplete="off" required>
                        <!-- выпадающее меню подсказок -->
                        <div id="city-suggest" class="dropdown-menu w-100"></div>
                        <div class="invalid-feedback">Укажите город из списка.</div>
                      </div>

                      <div class="col-6">
                        <label class="form-label">Дата рождения</label>
                        <input type="date" class="form-control" id="datepicker" required />
                      </div>

                      <div class="col-6">
                        <label class="form-label">Время рождения</label>
                        <input type="time" class="form-control" id="timepicker" required />
                        <div class="form-check mt-2">
                          <input class="form-check-input" type="checkbox" id="unknownTime">
                          <label class="form-check-label" for="unknownTime">Не знаю время (поставим 12:00)</label>
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <hr class="my-4" />
                      <h4 class="mb-3">Ежедневный гороскоп по транзитам</h4>
                      <div class="row g-3">
                        <div class="col-md-6">
                          <label class="form-label" for="transitTime">Время отправки</label>
                          <input type="time" class="form-control" id="transitTime" />
                          <div class="hint mt-1">
                            В это время вы будете получать ежедневную интерпретацию транзитов.
                          </div>
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                          <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="subscribeDaily">
                            <label class="form-check-label" for="subscribeDaily">
                              Подписаться на ежедневный гороскоп
                            </label>
                          </div>
                        </div>
                      </div>
                    </div>

                    <hr class="my-4" />
                    <button class="w-100 btn btn-primary btn-lg" type="submit">Сохранить</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
  // ====== Telegram SDK ======
  const tg = window.Telegram?.WebApp;
  tg?.ready();

  function pickInitData() {
    // 1) WebApp.initData (основной вариант)
    if (tg?.initData && tg.initData.length > 0) return tg.initData;
    // 2) query ?init_data=...
    const sp = new URLSearchParams(location.search);
    const q1 = sp.get('init_data') || sp.get('tgWebAppData');
    if (q1) return q1;
    // 3) hash #tgWebAppData=...
    const hp = new URLSearchParams(location.hash.startsWith('#') ? location.hash.slice(1) : location.hash);
    const q2 = hp.get('init_data') || hp.get('tgWebAppData');
    if (q2) return q2;
    return '';
  }

  const INIT_DATA = pickInitData();

  // ====== API base ======
function getApiBase() {
  const qs = new URLSearchParams(location.search);
  const env = (qs.get('env') || 'prod').toLowerCase();

  // Маппинг окружений на API
  if (env === 'dev') {
    return 'https://dev-api.astrogvido.ru/';   // dev API
  }

  // по умолчанию считаем, что прод
  return 'https://api.astrogvido.ru/';         // prod API
}

  const API_BASE = getApiBase();

  function apiUrl(path, params) {
    const u = new URL(path, API_BASE);
    if (params) {
      for (const [k, v] of Object.entries(params)) {
        if (v !== undefined && v !== null) u.searchParams.set(k, String(v));
      }
    }
    return u.toString();
  }

  // ====== Suggest (как было) ======
  const DEBOUNCE_MS = 250;
  const MIN_QUERY = 2;
  const SESSIONTOKEN = (self.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));
  let SUGGEST_LL = null, SUGGEST_SPN = null;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      ({ coords: { latitude, longitude } }) => {
        SUGGEST_LL = `${longitude.toFixed(4)},${latitude.toFixed(4)}`;
        SUGGEST_SPN = '10,8';
      },
      () => { },
      { maximumAge: 60_000, timeout: 2_000, enableHighAccuracy: false }
    );
  }

  let selected = null;

  function debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  }

  function renderSuggestions(items) {
    const $drop = $('#city-suggest');
    $drop.empty();
    if (!items || !items.length) {
      $drop.removeClass('show');
      return;
    }
    items.forEach(it => {
      const $a = $('<a class="dropdown-item" href="#"></a>').text(it.label);
      $a.on('click', (e) => {
        e.preventDefault();
        selected = it;
        $('#city').val(it.label);
        $drop.removeClass('show');
      });
      $drop.append($a);
    });
    $drop.addClass('show');
  }

  const suggest = debounce(async function () {
    selected = null;
    const text = $('#city').val().trim();
    if (text.length < MIN_QUERY) {
      $('#city-suggest').removeClass('show');
      return;
    }

    const params = {
      text,
      lang: 'ru_RU',
      results: 8,
      types: 'geo',
      print_address: 1,
      attrs: 'uri',
      sessiontoken: SESSIONTOKEN
    };
    if (SUGGEST_LL) params.ll = SUGGEST_LL;
    if (SUGGEST_SPN) params.spn = SUGGEST_SPN;

    try {
      const url = apiUrl('/places/suggest_ya', params);
      const r = await fetch(url, { cache: 'no-store' });
      const data = await r.json();
      renderSuggestions(data.items || []);
    } catch (e) {
      $('#city-suggest').removeClass('show');
    }
  }, DEBOUNCE_MS);

  $('#city').on('input focus', suggest);
  $(document).on('click', (e) => {
    if (!$(e.target).closest('#city').length && !$(e.target).closest('#city-suggest').length) {
      $('#city-suggest').removeClass('show');
    }
  });

  // ====== Загрузка профиля (GET /tg/profile) — по желанию ======
  async function loadProfileFromApi() {
    if (!INIT_DATA) return; // если не из Telegram — пропускаем

    try {
      const url = apiUrl('/tg/profile', { init_data: INIT_DATA });
      const r = await fetch(url, { cache: 'no-store' });
      const data = await r.json();

      if (!data.profile) return;
      const p = data.profile;

      if (p.date) $('#datepicker').val(p.date);
      if (p.time) $('#timepicker').val(p.time.slice(0, 5)); // HH:MM:SS -> HH:MM
      if (p.send_time) {
        $('#transitTime').val(p.send_time);
      }
      // город мы сейчас обратно не восстанавливаем (нет label в ответе),
      // можно потом добавить, если будешь это хранить.
    } catch (e) {
      console.warn('Не удалось загрузить профиль:', e);
    }
  }

  $(document).ready(() => {
    loadProfileFromApi();
  });

  // ====== Submit ======
  $('form.needs-validation').on('submit', async function (e) {
    e.preventDefault();

    const name = $('#firstName').val().trim(); // пока никуда не шлём, только в будущем
    const date_local = $('#datepicker').val(); // yyyy-mm-dd
    let time_local = $('#unknownTime').is(':checked')
      ? '12:00:00'
      : ($('#timepicker').val() || '');

    if (!date_local) {
      alert('Укажите дату рождения.');
      return;
    }

    if (!time_local) time_local = '12:00:00';
    else if (time_local.length === 5) time_local += ':00'; // HH:MM -> HH:MM:00

    const cityVal = $('#city').val().trim();
    if (!cityVal) {
      alert('Укажите город.');
      return;
    }

    if (!selected) {
      alert('Пожалуйста, выберите город из списка подсказок, а не просто вводите текст.');
      return;
    }

    // --- Ежедневные транзиты ---
    const sendTimeRaw = $('#transitTime').val().trim();
    // (чекбокса у нас нет — если поле заполнено, значит, человек хочет рассылку)
    const subscribeDaily = !!sendTimeRaw;

    // 1) Сначала ходим в /natal/by_city, чтобы backend сам:
    //    - геокодил город,
    //    - нашёл таймзону,
    //    - посчитал исторический UTC offset,
    //    - вернул lat/lon + utc_offset_str.
    const basePayload = {
      name,
      lang: 'ru',
      date_local,
      time_local,
      yandex_uri: selected.uri,
      label: selected.label,
      city: selected.label
    };

    let place;
    try {
      const rNatal = await fetch(apiUrl('/natal/by_city'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(basePayload)
      });
      const natalData = await rNatal.json();
      if (!rNatal.ok) {
        throw new Error(natalData.detail || natalData.error || 'Ошибка расчёта натальной карты');
      }
      place = natalData.place;
      if (!place || place.lat == null || place.lon == null || !place.utc_offset_str) {
        throw new Error('Сервис не вернул координаты и часовой пояс.');
      }
    } catch (err) {
      alert('Не удалось определить место и время рождения: ' + err.message);
      return;
    }

    // 2) Если форма открыта НЕ из Telegram — просто покажем, что всё ок,
    //    а профиль в боте сохранять некуда.
    if (!tg || !INIT_DATA) {
      alert('Профиль рассчитан: ' + (place.display_name || 'ok') + '\nОткройте эту форму из Telegram-бота, чтобы сохранить профиль.');
      return;
    }

    // 3) Собираем payload под /tg/profile (ProfileUpdate)
    const profilePayload = {
      date: date_local,          // /tg/profile сам нормализует
      time: time_local,          // "HH:MM:SS" или "HH:MM"
      tz: place.utc_offset_str,  // "+03:00" и т.п.
      lat: place.lat,
      lon: place.lon
    };

    if (subscribeDaily && sendTimeRaw) {
      profilePayload.send_time = sendTimeRaw; // формат HH:MM, как требует backend
    } else {
      profilePayload.send_time = null;
    }

    try {
      const url = apiUrl('/tg/profile', { init_data: INIT_DATA });
      const r = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(profilePayload)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        throw new Error(data.detail || data.error || 'Ошибка сохранения профиля');
      }

      // В Telegram: тихо закрываем форму, бот дальше уже работает с профилем из Sub.
      if (tg) {
        tg.close();
      } else {
        alert('Профиль сохранён ✅');
      }
    } catch (err) {
      alert('Не удалось сохранить профиль: ' + err.message);
    }
  });
</script>



</body>

</html>
